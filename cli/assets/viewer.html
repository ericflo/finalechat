<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session explorer</title>
<style>:root{color-scheme:dark;font:15px system-ui,sans-serif;color:#e6e7ed;background:#11141b}*{box-sizing:border-box}body{margin:0 auto;max-width:1200px;padding:20px}h1{font-size:24px}p{line-height:1.5;color:#aeb6c9}button,input,select{font:inherit;background:#202736;color:inherit;border:1px solid #414c66;border-radius:8px;padding:9px}button{cursor:pointer}button[aria-pressed=true]{background:#51437b}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #c3b7ff}header,nav,.filters{display:flex;gap:10px;align-items:center;flex-wrap:wrap}header{justify-content:space-between}nav{margin:20px 0}.filters input{flex:1;min-width:160px}.event,.card{border:1px solid #333d50;background:#191f2c;border-radius:10px;padding:16px;margin:14px 0}.event h3{font-size:15px;margin:0 0 8px}.event small{display:block;color:#aeb6c9;overflow-wrap:anywhere}.event p,pre{white-space:pre-wrap;overflow-wrap:anywhere;color:inherit;line-height:1.6}pre{font:13px ui-monospace,monospace;max-height:600px;overflow:auto}summary{cursor:pointer;color:#bac1d4}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.card strong{font-size:24px;display:block;margin:10px 0}.error{color:#ffafae}.timeline{display:flex;gap:12px;align-items:center;margin:18px 0}.timeline input{flex:1}a{color:#c3b7ff}.pages{display:flex;gap:12px;align-items:center;margin:15px 0}</style>
<header><h1 id="title">Session explorer</h1><button id="local">Open extracted archive</button></header><p id="status" role="status">Open a saved archive to inspect its native session records.</p><p id="error" class="error" role="alert"></p>
<nav aria-label="Explorer sections" id="tabs"></nav><div class="filters"><input id="search" aria-label="Search events" placeholder="Search messages, tools, IDs, errors…"><select id="source" aria-label="Session or subagent"><option value="">All sessions and subagents</option></select><select id="kind" aria-label="Event type"><option value="">All event types</option></select></div>
<label class="timeline">Captured events <input id="timeline" type="range" min="0" max="0" value="0"><output id="position">0</output></label><main id="content"></main><div class="pages"><button id="previous">Previous</button><span id="page"></span><button id="next">Next</button></div>
<script>/* FINALE_ARTIFACT_SDK */</script><script>
"use strict";const $=id=>document.getElementById(id),node=(tag,text)=>{const n=document.createElement(tag);if(text!==undefined)n.textContent=String(text);return n};let manifest,events=[],section="Overview",page=0,cap=false,loadGeneration=0;const pageSize=100;
function fail(e){$("error").textContent=e.message||String(e)}
function extract(record){const p=record.payload||record,m=record.message||p;let kind=record.type||"event",role=m.role||"",parts=[],tools=[];
 if(record.type==="response_item")kind=p.type||kind;if(record.type==="event_msg")kind=p.type||kind;
 const content=m.content;if(typeof content==="string")parts.push(content);if(Array.isArray(content))for(const c of content){if(c.text)parts.push(c.text);if(c.type==="tool_use")tools.push({id:c.id,name:c.name,input:c.input});if(c.type==="tool_result")tools.push({id:c.tool_use_id,result:c.content,is_error:c.is_error})}
 if(typeof p.message==="string"&&!parts.length)parts.push(p.message);if(p.type==="function_call"||p.type==="custom_tool_call")tools.push({id:p.call_id,name:p.name,input:p.arguments??p.input});if(p.type==="function_call_output"||p.type==="custom_tool_call_output")tools.push({id:p.call_id,result:p.output});
 if(!role&&["user","assistant"].includes(record.type))role=record.type;if(!role&&kind==="agent_message")role="assistant";if(!role&&kind==="user_message")role="user";
 return{kind,role,text:parts.join("\n\n"),tools,id:record.uuid||p.id||p.call_id||"",time:record.timestamp||p.timestamp||"",record}}
async function load(){const generation=++loadGeneration;try{$("error").textContent="";events=[];page=0;cap=false;manifest=await finale.manifest();$("title").textContent=`${manifest.producer.name} · Session explorer`;const types=new Set(),files=manifest.dataset.files||[];$("source").replaceChildren(node("option","All sessions and subagents"));$("source").firstChild.value="";let bytes=0;
 for(const path of files){const option=node("option",path);option.value=path;$("source").append(option);let line=0;for await(const raw of finale.lines(path)){if(generation!==loadGeneration)return;line++;if(!raw.trim())continue;bytes+=raw.length;if(events.length>=100000||bytes>134217728){cap=true;break}const e=extract(JSON.parse(raw));e.file=path;e.line=line;e.index=events.length+1;events.push(e);types.add(e.kind);if(events.length%500===0){$("status").textContent=`Loading ${events.length.toLocaleString()} native events…`;await new Promise(resolve=>setTimeout(resolve,0))}}if(cap)break}
 $("kind").replaceChildren(node("option","All event types"));$("kind").firstChild.value="";for(const kind of [...types].sort()){const o=node("option",kind);o.value=kind;$("kind").append(o)}$("timeline").max=events.length;$("timeline").value=events.length;$("status").textContent=`${events.length.toLocaleString()} native events · captured ${manifest.captured_at}${cap?" · Display limit reached; original files remain complete and downloadable.":""}`;render()}catch(e){fail(e)}}
function filtered(){const q=$("search").value.toLowerCase(),source=$("source").value,kind=$("kind").value,until=Number($("timeline").value);return events.filter(e=>e.index<=until&&(!source||e.file===source)&&(!kind||e.kind===kind)&&(!q||JSON.stringify(e.record).toLowerCase().includes(q)))}
function render(){if(!manifest)return;$("content").replaceChildren();$("position").textContent=`${$("timeline").value} / ${events.length}`;for(const b of $("tabs").children)b.setAttribute("aria-pressed",b.textContent===section);let selected=filtered();if(section==="Conversation")selected=selected.filter(e=>e.role&&e.text);if(section==="Tools")selected=selected.filter(e=>e.tools.length||/tool|function|command|error/.test(e.kind));
 if(section==="Overview"){const cards=node("div");cards.className="cards";for(const [label,value] of [["Captured events",events.length.toLocaleString()],["Native files",manifest.dataset.files.length],["Tool records",events.filter(e=>e.tools.length).length],["Artifact bytes",manifest.files.reduce((n,f)=>n+f.size,0).toLocaleString()]]){const box=node("div",label);box.className="card";box.append(node("strong",value));cards.append(box)}$("content").append(cards,node("p","The original JSONL files are the permanent record. This viewer interprets messages, tools and subagents without connecting to the original agent. Select Events to inspect any captured record, including unfamiliar event types."));const pre=node("pre",JSON.stringify(manifest.dataset,null,2));$("content").append(pre);selected=[]}
 if(section==="Files"){for(const f of manifest.files){const box=node("div");box.className="event";box.append(node("h3",f.path),node("small",`${f.role} · ${f.size.toLocaleString()} bytes · SHA-256 ${f.sha256}`));if(f.size<=134217728){const button=node("button","Download file");button.onclick=async()=>{try{const parts=[];for await(const part of finale.chunks(f.path))parts.push(part);const url=URL.createObjectURL(new Blob(parts,{type:"application/octet-stream"}));const a=node("a");a.href=url;a.download=f.path.split("/").pop();a.click();setTimeout(()=>URL.revokeObjectURL(url),60000)}catch(e){fail(e)}};box.append(button)}else box.append(node("p","Download the complete archive using FinaleChat’s Download button, or use this file in the extracted archive."));$("content").append(box)}selected=[]}
 const pages=Math.max(1,Math.ceil(selected.length/pageSize));page=Math.min(page,pages-1);if(!["Overview","Files"].includes(section))for(const e of selected.slice(page*pageSize,(page+1)*pageSize)){const box=node("article");box.className="event";box.id="event-"+e.index;box.append(node("h3",`${e.index} · ${e.role||e.kind}`),node("small",`${e.time} · ${e.file}:${e.line}${e.id?" · "+e.id:""}`));if(e.text)box.append(node("p",e.text));for(const tool of e.tools){const detail=node("details");detail.append(node("summary",tool.name||"Tool result"),node("pre",JSON.stringify(tool,null,2)));box.append(detail)}const details=node("details");details.append(node("summary","Original native record"),node("pre",JSON.stringify(e.record,null,2)));box.append(details);$("content").append(box)}$("previous").disabled=page===0;$("next").disabled=page>=pages-1;$("page").textContent=`${selected.length.toLocaleString()} matching records · ${page+1} / ${pages}`}
for(const name of ["Overview","Conversation","Tools","Events","Files"]){const b=node("button",name);b.onclick=()=>{section=name;page=0;render()};$("tabs").append(b)}for(const id of ["search","source","kind","timeline"])$(id).oninput=()=>{page=0;render()};$("previous").onclick=()=>{page--;render()};$("next").onclick=()=>{page++;render()};$("local").onclick=()=>finale.openLocalFiles().catch(fail);finale.on("local",load);finale.ready.then(connected=>{if(connected){$("local").hidden=true;void load()}});
</script></html>
