# Finalechat delivery: test on every default-branch push, then publish one
# immutable image that Flux promotes into Epsilon. Pull requests and other
# branches are tested locally; only main runs inside the production cluster.

steps:
  - name: test-server
    image: docker.io/library/golang:1.26.10-bookworm@sha256:e0c50aecba3a2edfab18924d493cd9210b73c4746fc5fd5b3bb46e0ec7f0465a
    commands:
      - export HOME=/tmp/finalechat-home GOCACHE=/tmp/finalechat-go-build GOMODCACHE=/tmp/finalechat-go-mod GOFLAGS=-buildvcs=false
      - mkdir -p "$HOME" "$GOCACHE" "$GOMODCACHE"
      - |
        if [ -n "$(gofmt -l cmd internal assets.go)" ]; then
          gofmt -l cmd internal assets.go
          echo "gofmt reported unformatted files" >&2
          exit 1
        fi
      - go vet ./...
      - go build ./...
      # Database-free unit tests here; the integration suite against PostgreSQL
      # runs in the Dockerfile's test stage, gating the published image.
      - go test -count=1 ./...
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi}
          limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 2Gi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile: {type: RuntimeDefault}
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}

  - name: test-web
    image: docker.io/library/node:22-bookworm-slim@sha256:5ec23b7c622b00547753bc6ffd78085dd868a68aeb41c8e0a1418f033e13d96d
    commands:
      - export HOME=/tmp/finalechat-home npm_config_cache=/tmp/finalechat-npm
      - mkdir -p "$HOME"
      - cd web
      - npm ci --no-audit --no-fund
      - npm run typecheck
      - npm run build
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 250m, memory: 512Mi, ephemeral-storage: 512Mi}
          limits: {cpu: "2", memory: 2Gi, ephemeral-storage: 2Gi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile: {type: RuntimeDefault}
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}

  - name: test-cli
    image: docker.io/library/python:3.13-slim@sha256:09a17cad02668ae61ece136b4fd36ac3849e14f670ebedb637ea3e15580525bc
    commands:
      - python3 -m py_compile cli/finalechat
      - python3 cli/finalechat --help >/dev/null
      - python3 cli/finalechat selftest
      - sh -n cli/install.sh
      - python3 -c "import json; json.load(open('docs/openapi.json'))"
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 50m, memory: 64Mi}
          limits: {cpu: 500m, memory: 256Mi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile: {type: RuntimeDefault}
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}

  - name: publish-immutable-image
    image: docker.io/moby/buildkit:v0.34.2-rootless@sha256:c8252268760e1baba80780d63d738ef9f260fb7c7c0973c78494cb9ddd99eda1
    depends_on: [test-server, test-web, test-cli]
    when:
      - evaluate: 'CI_PIPELINE_EVENT == "push" && CI_COMMIT_BRANCH == CI_REPO_DEFAULT_BRANCH'
    commands:
      - |-
        set -eu
        buildkit_addr=tcp://buildkit.ci-build.svc.cluster.local:1234
        attempt=0
        until buildctl --addr "$${buildkit_addr}" debug workers >/dev/null 2>&1; do
          attempt=$$((attempt + 1))
          [ "$${attempt}" -lt 30 ] || { echo "BuildKit did not become ready" >&2; exit 1; }
          sleep 2
        done
        build_time="$$(date -u -d "@$${CI_PIPELINE_CREATED}" +%Y%m%d%H%M%S)"
        short_sha="$$(printf '%s' "$${CI_COMMIT_SHA}" | cut -c1-12)"
        image_tag="main-$${build_time}-$${short_sha}"
        registry=registry.clouderic.svc.cluster.local:5000
        cache_ref="$${registry}/finalechat-build-cache:main"
        buildctl --addr "$${buildkit_addr}" build \
          --frontend dockerfile.v0 --local context=. --local dockerfile=. \
          --opt filename=Dockerfile --opt platform=linux/amd64 \
          --opt "build-arg:VERSION=$${image_tag}" \
          --opt "label:org.opencontainers.image.source=$${CI_REPO_URL}" \
          --opt "label:org.opencontainers.image.revision=$${CI_COMMIT_SHA}" \
          --opt "label:org.opencontainers.image.created=$$(date -u -d "@$${CI_PIPELINE_CREATED}" +%Y-%m-%dT%H:%M:%SZ)" \
          --opt attest:provenance=mode=max \
          --import-cache "type=registry,ref=$${cache_ref},registry.insecure=true" \
          --export-cache "type=registry,ref=$${cache_ref},mode=max,registry.insecure=true" \
          --output "type=image,name=$${registry}/finalechat:$${image_tag},push=true,registry.insecure=true"
        printf 'Published finalechat at immutable tag %s\n' "$${image_tag}"
    backend_options:
      kubernetes:
        resources:
          requests: {cpu: 100m, memory: 128Mi}
          limits: {cpu: "1", memory: 1Gi}
        securityContext:
          runAsNonRoot: true
          runAsUser: 1000
          runAsGroup: 1000
          fsGroup: 1000
          fsGroupChangePolicy: OnRootMismatch
          seccompProfile: {type: RuntimeDefault}
          allowPrivilegeEscalation: false
          capabilities: {drop: [ALL]}

when:
  - evaluate: 'CI_PIPELINE_EVENT == "push" && CI_COMMIT_BRANCH == CI_REPO_DEFAULT_BRANCH'
